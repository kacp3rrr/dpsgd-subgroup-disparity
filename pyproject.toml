[project]
name = "dpdisparity"
version = "0.1.0"
description = "Reproduction and analysis of disparate impact in DP-SGD (Esipova et al., ICLR 2023)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",          # >=2.7 + CUDA 12.8 needed for RTX 50-series (Blackwell)
    "torchvision>=0.22",
    "opacus>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "folktables>=0.0.12",
]

[dependency-groups]
dev = ["jupyterlab>=4", "ipykernel>=6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdisparity"]

# CUDA 12.8 wheels on Linux/Windows (also run on CPU-only machines); macOS uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
